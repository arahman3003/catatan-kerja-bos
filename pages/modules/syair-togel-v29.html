<section class="syair-generator-page" id="dashPostinganSyair" aria-label="Syair Togel">
  <div class="syair-generator-shell">
    <div class="syair-preview-column">
      <div class="syair-preview-head">
        <div><span class="syair-kicker">POSTINGAN • SYAIR TOGEL</span><h1 id="syairGeneratorTitle">GENERATOR SYAIR</h1></div>
        <span class="syair-live-badge">● LIVE PREVIEW</span>
      </div>
      <div class="syair-canvas-wrap"><canvas id="absensiSyairCanvas" width="1080" height="1440"></canvas></div>
    </div>
    <aside class="syair-control-panel">
      <div class="syair-theme-switcher" id="syairThemeButtons">
        <button type="button" class="syair-theme-btn theme-gold active" data-syair-theme="gold">EMAS</button>
        <button type="button" class="syair-theme-btn theme-blue" data-syair-theme="blue">BIRU</button>
        <button type="button" class="syair-theme-btn theme-purple" data-syair-theme="purple">MERAH UNGU</button>
      </div>
      <div class="syair-control-title" id="syairControlTitle">⚜️ PENGATURAN SYAIR</div>
      <label>Pasaran<select id="syairPasaran"></select></label>
      <label>Shio Hari Ini<select id="syairShio"></select></label>
      <label>Isi Syair<textarea id="syairText" rows="7" placeholder="Tulis syair di sini..."></textarea></label>
      <div class="syair-control-actions">
        <button type="button" class="syair-btn gold" id="syairAcakSemua">🎲 Acak Semua</button>
        <button type="button" class="syair-btn dark" id="syairAcakText">📝 Acak Syair</button>
        <button type="button" class="syair-btn gold full" id="syairDownload">⬇ Download PNG</button>
      </div>
      <p class="syair-tip">Angka otomatis diacak dari 1–9 saat tombol Acak Semua diklik. Isi syair tetap dapat diubah manual.</p>
    </aside>
  </div>
</section>
